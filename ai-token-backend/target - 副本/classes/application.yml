server:
  port: 8082
  servlet:
    context-path: /

spring:
  application:
    name: ai-token-backend

  # 数据源
  datasource:
    url: jdbc:mysql://localhost:3306/ai_token?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
#    username: root
#    password: Root@2026Ai!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis
  redis:
    host: 127.0.0.1
    port: 6379
#    password:            # 无密码留空
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        min-idle: 1
        max-idle: 8
        max-active: 8

  # 异步线程池
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 200
      thread-name-prefix: async-task-

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aitoken.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token 配置
sa-token:
  token-name: Authorization          # token 名称
  timeout: 86400                      # token 有效期(秒): 1天
  active-timeout: -1                  # token 最低活跃频率(-1不限制)
  is-concurrent: true                 # 是否允许同一账号并发登录
  is-share: false                     # 并发时是否共用一个token
  token-style: uuid                   # token 风格
  is-print: false                     # 关闭 banner

# 平台自定义配置
aitoken:
  aes-key: AiToken@2026!Key          # 16位 AES 密钥，用于加密渠道 API Key
  api-key-prefix: "sk-"              # 平台 API Key 前缀

# Springdoc Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# 日志
logging:
  level:
    com.aitoken: debug
    com.baomidou.mybatisplus: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file:    "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /opt/ai-token/logs/ai-token.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
