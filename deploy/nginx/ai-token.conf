# ============================================================
#  AI Token 管理平台 - Nginx 生产配置
#  路径前缀: /ai-token/  (支持与其他项目共享 80 端口)
#  部署位置: /etc/nginx/conf.d/ai-token.conf
# ============================================================

# 后端 upstream（Spring Boot 双实例，长连接）
upstream ai_token_backend {
    least_conn;
    server 127.0.0.1:8082;
    server 127.0.0.1:8083;
    keepalive 64;
}

server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 20m;

    access_log  /var/log/nginx/ai-token-access.log;
    error_log   /var/log/nginx/ai-token-error.log  warn;

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript application/x-javascript
        application/xml image/svg+xml;

    server_tokens off;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ── 管理后台 API 代理 /ai-token/api/ ─────────────────────
    location /ai-token/api/ {
        proxy_pass          http://ai_token_backend/api/;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ── AI 代理接口 /ai-token/v1/（SSE 流式响应）────────────
    location /ai-token/v1/ {
        proxy_pass          http://ai_token_backend/v1/;
        proxy_http_version  1.1;
        proxy_set_header    Connection        "";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering         off;
        proxy_cache             off;
        proxy_set_header        Accept-Encoding "";
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        add_header  Cache-Control  "no-cache";
        add_header  X-Accel-Buffering "no";
    }

    # ── 前端静态文件 /ai-token/ ───────────────────────────────
    location /ai-token/ {
        alias  /opt/ai-token/dist/;
        index  index.html;
        # Vue Router history 模式：找不到文件则回退到 index.html
        try_files $uri $uri/ @ai_token_spa;
    }

    # named location 处理 SPA 回退（alias + try_files 必须用此方式）
    location @ai_token_spa {
        rewrite ^ /ai-token/index.html last;
    }

    # 带 hash 的 JS/CSS 永久缓存
    location ~* ^/ai-token/.+\.(js|css)$ {
        alias  /opt/ai-token/dist/;
        expires     365d;
        add_header  Cache-Control "public, immutable";
    }

    # 图片/字体缓存 30 天
    location ~* ^/ai-token/.+\.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias  /opt/ai-token/dist/;
        expires     30d;
        add_header  Cache-Control "public, no-transform";
    }

    # ── 根路径重定向到 /ai-token/ ─────────────────────────────
    location = / {
        return 301 /ai-token/;
    }
}
